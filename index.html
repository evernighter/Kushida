<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封印解除</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="封印解除">
    
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-pink: #FF8DA1;
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.75);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'PingFang TC', sans-serif;
            background-color: #FFF0F5;
            color: #5D4037;
        }

        /* 櫻花特效 */
        #sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
        }

        .petal {
            position: absolute; background-color: #ffc0cb;
            border-radius: 150% 0 150% 0; opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
            100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; }
        }

        header {
            background: linear-gradient(135deg, rgba(255,183,197,0.9), rgba(255,141,161,0.9));
            color: white;
            padding: 55px 20px 18px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        header .subtitle {
            margin: 8px 0 0;
            font-size: 11px;
            opacity: 0.95;
            letter-spacing: 1px;
            font-weight: 300;
            line-height: 1.4;
        }

        /* 分頁背景設定 */
        .tab-content { 
            display: none; 
            min-height: 100vh;
            padding: 20px; 
            box-sizing: border-box;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: right bottom;
            background-size: contain;
            animation: magicFade 0.5s ease;
            padding-bottom: 150px;
        }

        .tab-content.active { display: block; }

        #day1 { background-image: url('icons/day1.png'); }
        #day2 { background-image: url('icons/day2.png'); }
        #day3 { background-image: url('icons/day3.png'); }
        #save { background-image: url('icons/save.png'); }

        @keyframes magicFade { from { opacity: 0; } to { opacity: 1; } }

        /* 內容卡片 */
        .card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            width: 85%;
            box-shadow: 0 8px 32px rgba(255, 141, 161, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .card h3 { margin: 0 0 10px; color: var(--deep-pink); font-size: 18px; }
        .card p { margin: 5px 0; font-size: 15px; line-height: 1.5; }

        /* 景點儲存樣式 */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 20px; border: 2px solid var(--sakura-pink); 
            background: rgba(255,255,255,0.9); outline: none;
        }
        .add-btn { background: var(--gold); color: white; border: none; padding: 0 15px; border-radius: 20px; font-weight: bold; }
        .save-item {
            background: var(--glass); padding: 12px; border-radius: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid white;
        }

        /* 導航列 */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 15px);
            border-top: 2px solid var(--sakura-pink);
            z-index: 1000;
        }

        nav button { background: none; border: none; color: #d2a6b0; font-size: 11px; }
        nav button.active { color: var(--deep-pink); font-weight: bold; transform: scale(1.1); transition: 0.3s; }
        nav button .icon { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="sakura-container"></div>

<header>
    <h1>✨ 封印解除 ✨</h1>
    <div class="subtitle">隱藏了黑暗力量的鑰匙啊~在我面前顯示真正的力量~</div>
</header>

<div id="day1" class="tab-content active">
    <div class="card">
        <h3>第一天：起程之卷</h3>
        <p>🕒 10:00 | 到達目的地</p>
        <p>🌸 13:00 | 魔法主題午餐</p>
    </div>
</div>

<div id="day2" class="tab-content">
    <div class="card">
        <h3>第二天：冒險之卷</h3>
        <p>🕒 09:30 | 收集庫洛牌景點</p>
    </div>
</div>

<div id="day3" class="tab-content">
    <div class="card">
        <h3>第三天：歸還之卷</h3>
        <p>🕒 15:00 | 購買紀念品</p>
    </div>
</div>

<div id="save" class="tab-content">
    <div class="card">
        <h3>⭐ 儲存想去的景點</h3>
        <div class="input-group">
            <input type="text" id="spotInput" placeholder="輸入景點名稱...">
            <button class="add-btn" onclick="addSpot()">封印</button>
        </div>
        <div id="spotList"></div>
    </div>
</div>

<nav>
    <button class="active" onclick="showTab('day1', this)"><span class="icon">🪄</span>Day 1</button>
    <button onclick="showTab('day2', this)"><span class="icon">🌸</span>Day 2</button>
    <button onclick="showTab('day3', this)"><span class="icon">🌟</span>Day 3</button>
    <button onclick="showTab('save', this)"><span class="icon">🎀</span>儲存</button>
</nav>

<script>
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    let spots = JSON.parse(localStorage.getItem('myMagicSpots')) || [];
    function renderSpots() {
        document.getElementById('spotList').innerHTML = spots.map((s, i) => `
            <div class="save-item">
                <span>🌸 ${s}</span>
                <button style="border:none; background:none; color:var(--deep-pink);" onclick="deleteSpot(${i})">×</button>
            </div>
        `).join('');
    }
    function addSpot() {
        const input = document.getElementById('spotInput');
        if (input.value.trim()) {
            spots.push(input.value.trim());
            localStorage.setItem('myMagicSpots', JSON.stringify(spots));
            input.value = '';
            renderSpots();
        }
    }
    function deleteSpot(i) {
        spots.splice(i, 1);
        localStorage.setItem('myMagicSpots', JSON.stringify(spots));
        renderSpots();
    }
    renderSpots();

    // 櫻花特效
    setInterval(() => {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.width = p.style.height = Math.random()*12+8+'px';
        p.style.left = Math.random()*100+'vw';
        p.style.animationDuration = Math.random()*4+3+'s';
        document.getElementById('sakura-container').appendChild(p);
        setTimeout(() => p.remove(), 5000);
    }, 600);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
