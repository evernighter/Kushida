<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封印解除</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="封印解除">
    
    <!-- 修正圖片路徑 -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-pink: #FF8DA1;
            --light-pink: #FFF0F5;
            --gold: #D4AF37;
        }

        body {
            margin: 0;
            font-family: 'PingFang TC', sans-serif;
            background-color: var(--light-pink);
            color: #555;
            padding-bottom: 100px;
        }

        header {
            background-color: var(--sakura-pink);
            color: white;
            padding: 50px 20px 20px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .tab-content { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 行程卡片 */
        .card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid var(--sakura-pink);
            box-shadow: 2px 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        /* 景點儲存輸入區 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--sakura-pink);
            border-radius: 10px;
            outline: none;
        }

        button.add-btn {
            background: var(--sakura-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .save-item {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }

        .delete-btn { color: #ff8888; border: none; background: none; font-size: 18px; }

        /* 底部導航 */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px);
            border-top: 1px solid var(--sakura-pink);
        }

        nav button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 11px;
            transition: 0.3s;
        }

        nav button.active { color: var(--deep-pink); transform: scale(1.1); }
        nav button .icon { font-size: 24px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 24px;">🌸 封印解除 🌸</h1>
    <p style="margin:5px 0 0; font-size: 14px; opacity: 0.9;">隱藏著旅遊力量的鑰匙啊...</p>
</header>

<!-- 行程分頁 -->
<div id="day1" class="tab-content active">
    <h3>第一天：起程之卷</h3>
    <div class="card">🕒 10:00 | 抵達魔法機場</div>
    <div class="card">🕒 13:00 | 櫻花主題餐廳</div>
    <div class="card">🕒 15:30 | 景點 A 巡禮</div>
</div>

<div id="day2" class="tab-content">
    <h3>第二天：冒險之卷</h3>
    <div class="card">🕒 09:30 | 魔法森林散策</div>
    <div class="card">🕒 14:00 | 神秘商店購物</div>
</div>

<div id="day3" class="tab-content">
    <h3>第三天：歸還之卷</h3>
    <div class="card">🕒 11:00 | 最後的紀念品購買</div>
    <div class="card">🕒 18:00 | 帶著回憶回家</div>
</div>

<!-- 景點儲存分頁 -->
<div id="save" class="tab-content">
    <h3>⭐ 想要捕捉的景點</h3>
    <div class="input-group">
        <input type="text" id="spotInput" placeholder="輸入景點名稱...">
        <button class="add-btn" onclick="addSpot()">封印!</button>
    </div>
    <div id="spotList"></div>
</div>

<nav>
    <button class="active" onclick="showTab('day1', this)"><span class="icon">🪄</span>Day 1</button>
    <button onclick="showTab('day2', this)"><span class="icon">✨</span>Day 2</button>
    <button onclick="showTab('day3', this)"><span class="icon">🌟</span>Day 3</button>
    <button onclick="showTab('save', this)"><span class="icon">🎀</span>儲存</button>
</nav>

<script>
    // 分頁切換邏輯
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo(0,0);
    }

    // 景點儲存邏輯
    let spots = JSON.parse(localStorage.getItem('mySpots')) || [];

    function renderSpots() {
        const list = document.getElementById('spotList');
        list.innerHTML = spots.map((spot, index) => `
            <div class="save-item">
                <span>🌸 ${spot}</span>
                <button class="delete-btn" onclick="deleteSpot(${index})">×</button>
            </div>
        `).join('');
    }

    function addSpot() {
        const input = document.getElementById('spotInput');
        if (input.value.trim()) {
            spots.push(input.value.trim());
            localStorage.setItem('mySpots', JSON.stringify(spots));
            input.value = '';
            renderSpots();
        }
    }

    function deleteSpot(index) {
        spots.splice(index, 1);
        localStorage.setItem('mySpots', JSON.stringify(spots));
        renderSpots();
    }

    // 初始化
    renderSpots();

    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
