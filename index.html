<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封印解除</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="封印解除">
    
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-pink: #FF8DA1;
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            margin: 0;
            font-family: 'PingFang TC', sans-serif;
            background-color: #000; /* 背景深色，讓圖片載入前不刺眼 */
            color: #4A2C2A;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* 櫻花特效容器 */
        #sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .petal {
            position: absolute;
            background-color: #ffc0cb;
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(80px, 100vh) rotate(360deg); opacity: 0; }
        }

        header {
            background: linear-gradient(135deg, rgba(255,183,197,0.9), rgba(255,141,161,0.9));
            color: white;
            padding: 55px 20px 20px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 分頁背景共用設定 */
        .tab-content { 
            display: none; 
            min-height: calc(100vh - 150px);
            padding: 20px; 
            animation: magicIn 0.5s ease-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* 讓背景固定，內容滾動 */
        }

        .tab-content.active { display: block; }

        /* 各別分頁背景圖片 */
        #day1 { background-image: linear-gradient(rgba(255,240,245,0.3), rgba(255,240,245,0.3)), url('images/day1.png'); }
        #day2 { background-image: linear-gradient(rgba(255,240,245,0.3), rgba(255,240,245,0.3)), url('images/day2.png'); }
        #day3 { background-image: linear-gradient(rgba(255,240,245,0.3), rgba(255,240,245,0.3)), url('images/day3.png'); }
        #save { background-image: linear-gradient(rgba(255,240,245,0.3), rgba(255,240,245,0.3)), url('images/save.png'); }

        @keyframes magicIn {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 內容卡片 - 玻璃擬態 */
        .card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(255, 183, 197, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card h4 { margin: 0 0 5px; color: var(--deep-pink); font-size: 18px; }

        /* 景點儲存樣式 */
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 20px; border: 2px solid var(--sakura-pink); outline: none;
            background: rgba(255, 255, 255, 0.9);
        }
        .add-btn { 
            background: var(--gold); color: white; border: none; padding: 10px 20px; 
            border-radius: 20px; font-weight: bold; 
        }

        .save-item {
            background: var(--glass);
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        /* 底部導航列 */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px);
            border-top: 2px solid var(--sakura-pink);
            z-index: 1000;
        }

        nav button { background: none; border: none; color: #bca0a5; font-size: 11px; }
        nav button.active { color: var(--deep-pink); font-weight: bold; }
        nav button .icon { font-size: 22px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<div id="sakura-container"></div>

<header>
    <h1 style="margin:0; font-size: 22px; letter-spacing: 2px;">✨ 封印解除 ✨</h1>
</header>

<!-- 第一天 -->
<div id="day1" class="tab-content active">
    <div class="card">
        <h4>第一天：起程之卷</h4>
        <p>🕒 10:00 | 抵達目的地</p>
        <p>🕒 14:00 | 魔法景點探索</p>
    </div>
    <!-- 更多卡片... -->
</div>

<!-- 第二天 -->
<div id="day2" class="tab-content">
    <div class="card">
        <h4>第二天：冒險之卷</h4>
        <p>🕒 09:00 | 森林步道漫步</p>
    </div>
</div>

<!-- 第三天 -->
<div id="day3" class="tab-content">
    <div class="card">
        <h4>第三天：歸還之卷</h4>
        <p>🕒 16:00 | 帶著滿滿回憶歸家</p>
    </div>
</div>

<!-- 景點儲存 -->
<div id="save" class="tab-content">
    <div class="card">
        <h4>⭐ 想要捕捉的景點</h4>
        <div class="input-group">
            <input type="text" id="spotInput" placeholder="輸入景點...">
            <button class="add-btn" onclick="addSpot()">封印</button>
        </div>
        <div id="spotList"></div>
    </div>
</div>

<nav>
    <button class="active" onclick="showTab('day1', this)"><span class="icon">🪄</span>Day 1</button>
    <button onclick="showTab('day2', this)"><span class="icon">🌸</span>Day 2</button>
    <button onclick="showTab('day3', this)"><span class="icon">🌟</span>Day 3</button>
    <button onclick="showTab('save', this)"><span class="icon">🎀</span>儲存</button>
</nav>

<script>
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo(0,0);
    }

    // 儲存邏輯
    let spots = JSON.parse(localStorage.getItem('mySpots')) || [];
    function renderSpots() {
        document.getElementById('spotList').innerHTML = spots.map((s, i) => `
            <div class="save-item">
                <span>🌸 ${s}</span>
                <button style="border:none; background:none; color:var(--deep-pink);" onclick="deleteSpot(${i})">×</button>
            </div>
        `).join('');
    }
    function addSpot() {
        const val = document.getElementById('spotInput').value;
        if (val) { spots.push(val); localStorage.setItem('mySpots', JSON.stringify(spots)); renderSpots(); }
    }
    function deleteSpot(i) { spots.splice(i,1); localStorage.setItem('mySpots',JSON.stringify(spots)); renderSpots(); }
    renderSpots();

    // 櫻花特效
    setInterval(() => {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.width = p.style.height = Math.random()*10+10+'px';
        p.style.left = Math.random()*100+'vw';
        p.style.animationDuration = Math.random()*3+2+'s';
        document.getElementById('sakura-container').appendChild(p);
        setTimeout(() => p.remove(), 5000);
    }, 450);

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>

</body>
</html>
