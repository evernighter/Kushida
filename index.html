<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封印解除</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="封印解除">
    
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-pink: #FF8DA1;
            --gold: #D4AF37;
            --glass-white: rgba(255, 255, 255, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'PingFang TC', sans-serif;
            background-color: #FFF0F5;
            color: #5D4037;
            overflow-x: hidden;
        }

        /* 櫻花特效容器 */
        #sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .petal {
            position: absolute;
            background-color: #ffc0cb;
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(80px, 100vh) rotate(360deg); opacity: 0; }
        }

        header {
            background: linear-gradient(135deg, rgba(255,183,197,0.95), rgba(255,141,161,0.95));
            color: white;
            padding: 55px 20px 15px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 分頁背景共用設定 - 優化圖片顯示 */
        .tab-content { 
            display: none; 
            min-height: 100vh;
            padding: 20px; 
            box-sizing: border-box;
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            animation: magicFade 0.6s ease;
            padding-bottom: 120px;
        }

        .tab-content.active { display: block; }

        /* 指定背景圖片路徑（全部都在 icons/ 目錄下） */
        #day1 { background-image: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)), url('icons/day1.png'); }
        #day2 { background-image: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)), url('icons/day2.png'); }
        #day3 { background-image: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)), url('icons/day3.png'); }
        #save { background-image: linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)), url('icons/save.png'); }

        @keyframes magicFade {
            from { opacity: 0; filter: brightness(1.2); }
            to { opacity: 1; filter: brightness(1); }
        }

        /* 內容卡片 - 玻璃擬態 */
        .card {
            background: var(--glass-white);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(255, 141, 161, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .card h3 { margin-top: 0; color: var(--deep-pink); border-bottom: 2px solid var(--sakura-pink); display: inline-block; padding-bottom: 5px; }

        /* 景點儲存功能樣式 */
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px 15px; border-radius: 25px; border: 2px solid var(--sakura-pink); 
            background: white; outline: none; font-size: 16px;
        }
        .add-btn { 
            background: var(--gold); color: white; border: none; padding: 10px 20px; 
            border-radius: 25px; font-weight: bold; font-size: 14px;
        }

        .save-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--sakura-pink);
        }

        /* 底部導航列 */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 15px);
            border-top: 2px solid var(--sakura-pink);
            z-index: 1000;
        }

        nav button { background: none; border: none; color: #d2a6b0; font-size: 11px; transition: 0.3s; }
        nav button.active { color: var(--deep-pink); transform: scale(1.1); font-weight: bold; }
        nav button .icon { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="sakura-container"></div>

<header>
    <h1 style="margin:0; font-size: 22px; letter-spacing: 3px; font-weight: bold;">✨ 封印解除 ✨</h1>
</header>

<!-- 第一天 -->
<div id="day1" class="tab-content active">
    <div class="card">
        <h3>第一天：起程之卷</h3>
        <p>🌸 10:00 | 抵達目的地</p>
        <p>🌸 12:30 | 魔法午餐預約</p>
        <p>🌸 15:00 | 景點探索開始</p>
    </div>
</div>

<!-- 第二天 -->
<div id="day2" class="tab-content">
    <div class="card">
        <h3>第二天：冒險之卷</h3>
        <p>🌸 09:30 | 早晨的魔法散步</p>
        <p>🌸 14:00 | 隱藏景點收集</p>
    </div>
</div>

<!-- 第三天 -->
<div id="day3" class="tab-content">
    <div class="card">
        <h3>第三天：歸還之卷</h3>
        <p>🌸 11:00 | 最後的禮物挑選</p>
        <p>🌸 16:30 | 準備返回原本的世界</p>
    </div>
</div>

<!-- 景點儲存 -->
<div id="save" class="tab-content">
    <div class="card">
        <h3>⭐ 庫洛景點卡儲存</h3>
        <div class="input-group">
            <input type="text" id="spotInput" placeholder="輸入想封印的景點...">
            <button class="add-btn" onclick="addSpot()">封印!</button>
        </div>
        <div id="spotList"></div>
    </div>
</div>

<nav>
    <button class="active" onclick="showTab('day1', this)"><span class="icon">🪄</span>Day 1</button>
    <button onclick="showTab('day2', this)"><span class="icon">🌸</span>Day 2</button>
    <button onclick="showTab('day3', this)"><span class="icon">🌟</span>Day 3</button>
    <button onclick="showTab('save', this)"><span class="icon">🎀</span>儲存</button>
</nav>

<script>
    // 分頁切換
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // 景點儲存邏輯 (LocalStorage)
    let spots = JSON.parse(localStorage.getItem('myMagicSpots')) || [];
    function renderSpots() {
        document.getElementById('spotList').innerHTML = spots.map((s, i) => `
            <div class="save-item">
                <span>🌸 ${s}</span>
                <button style="border:none; background:none; color:var(--deep-pink); font-size:18px;" onclick="deleteSpot(${i})">×</button>
            </div>
        `).join('');
    }
    function addSpot() {
        const input = document.getElementById('spotInput');
        if (input.value.trim()) {
            spots.push(input.value.trim());
            localStorage.setItem('myMagicSpots', JSON.stringify(spots));
            input.value = '';
            renderSpots();
        }
    }
    function deleteSpot(i) {
        spots.splice(i, 1);
        localStorage.setItem('myMagicSpots', JSON.stringify(spots));
        renderSpots();
    }
    renderSpots();

    // 櫻花飄落效果
    setInterval(() => {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.width = p.style.height = Math.random()*12+8+'px';
        p.style.left = Math.random()*100+'vw';
        p.style.animationDuration = Math.random()*4+3+'s';
        document.getElementById('sakura-container').appendChild(p);
        setTimeout(() => p.remove(), 6000);
    }, 500);

    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
