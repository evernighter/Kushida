<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>封印解除</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="封印解除">
    
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --deep-pink: #FF8DA1;
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.75);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang TC', sans-serif;
            background-color: #FFF0F5;
            color: #5D4037;
            overflow-x: hidden;
        }

        /* --- 櫻花特效強化版 --- */
        #sakura-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 9999; /* 確保在最最上層 */
        }

        .petal {
            position: absolute;
            background-color: #ffc0cb;
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(100vh) translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* --- 頂部標題區 --- */
        header {
            background: linear-gradient(135deg, rgba(255,183,197,0.95), rgba(255,141,161,0.95));
            color: white;
            padding: 55px 20px 20px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
        }

        header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        header .subtitle { 
            margin-top: 8px; font-size: 11px; font-weight: 300; 
            opacity: 0.9; line-height: 1.4; letter-spacing: 0.5px;
        }

        /* --- 分頁與背景立繪 --- */
        .tab-content { 
            display: none; min-height: 100vh; padding: 20px; box-sizing: border-box;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: right bottom;
            background-size: contain; /* 確保立繪完整 */
            animation: magicFade 0.6s ease;
            padding-bottom: 150px;
        }

        .tab-content.active { display: block; }

        #day1 { background-image: url('icons/day1.png'); }
        #day2 { background-image: url('icons/day2.png'); }
        #day3 { background-image: url('icons/day3.png'); }
        #save { background-image: url('icons/save.png'); }

        @keyframes magicFade { from { opacity: 0; } to { opacity: 1; } }

        /* --- 內容卡片 --- */
        .card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            width: 80%; /* 留出更多右側給立繪 */
            box-shadow: 0 8px 32px rgba(255, 141, 161, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .card h3 { margin: 0 0 10px; color: var(--deep-pink); border-left: 4px solid var(--sakura-pink); padding-left: 10px; }

        /* --- 儲存功能 --- */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1; padding: 12px; border-radius: 20px; border: 2px solid var(--sakura-pink); outline: none;
        }
        .add-btn { background: var(--gold); color: white; border: none; padding: 0 15px; border-radius: 20px; font-weight: bold; }
        .save-item {
            background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--sakura-pink);
        }

        /* --- 導航列 --- */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            padding: 10px 0 calc(env(safe-area-inset-bottom) + 15px);
            border-top: 2px solid var(--sakura-pink);
            z-index: 2000;
        }

        nav button { background: none; border: none; color: #d2a6b0; font-size: 11px; }
        nav button.active { color: var(--deep-pink); font-weight: bold; transform: scale(1.1); }
        nav button .icon { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<!-- 櫻花容器 -->
<div id="sakura-container"></div>

<header>
    <h1>✨ 封印解除 ✨</h1>
    <div class="subtitle">隱藏了黑暗力量的鑰匙啊~在我面前顯示真正的力量~</div>
</header>

<div id="day1" class="tab-content active">
    <div class="card">
        <h3>第一天：起程之卷</h3>
        <p>🕒 10:00 | 測試</p>
        <p>🌸 13:00 | 測試</p>
    </div>
</div>

<div id="day2" class="tab-content">
    <div class="card">
        <h3>第二天：冒險之卷</h3>
        <p>🕒 09:30 | 測試</p>
    </div>
</div>

<div id="day3" class="tab-content">
    <div class="card">
        <h3>第三天：歸還之卷</h3>
        <p>🕒 15:00 | 測試</p>
    </div>
</div>

<div id="save" class="tab-content">
    <div class="card">
        <h3>⭐ 儲存景點</h3>
        <div class="input-group">
            <input type="text" id="spotInput" placeholder="想去哪裡？">
            <button class="add-btn" onclick="addSpot()">封印</button>
        </div>
        <div id="spotList"></div>
    </div>
</div>

<nav>
    <button class="active" onclick="showTab('day1', this)"><span class="icon">🪄</span>Day 1</button>
    <button onclick="showTab('day2', this)"><span class="icon">🌸</span>Day 2</button>
    <button onclick="showTab('day3', this)"><span class="icon">🌟</span>Day 3</button>
    <button onclick="showTab('save', this)"><span class="icon">🎀</span>儲存</button>
</nav>

<script>
    // 櫻花產生器
    const container = document.getElementById('sakura-container');
    function createPetal() {
        const petal = document.createElement('div');
        petal.className = 'petal';
        
        // 隨機大小與位置
        const size = Math.random() * 15 + 10 + 'px';
        petal.style.width = size;
        petal.style.height = size;
        petal.style.left = Math.random() * 100 + 'vw';
        
        // 隨機顏色變體 (不同的粉色)
        const colors = ['#ffc0cb', '#ffb7c5', '#ffe4e1', '#ffdae0'];
        petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // 隨機動畫時長
        petal.style.animationDuration = Math.random() * 3 + 4 + 's';
        
        container.appendChild(petal);

        // 動畫結束後移除
        setTimeout(() => { petal.remove(); }, 7000);
    }
    // 每 400 毫秒產生一片花瓣
    setInterval(createPetal, 400);

    // 分頁邏輯
    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // 儲存邏輯
    let spots = JSON.parse(localStorage.getItem('myMagicSpots')) || [];
    function renderSpots() {
        document.getElementById('spotList').innerHTML = spots.map((s, i) => `
            <div class="save-item">
                <span>🌸 ${s}</span>
                <button style="border:none; background:none; color:var(--deep-pink);" onclick="deleteSpot(${i})">×</button>
            </div>
        `).join('');
    }
    function addSpot() {
        const input = document.getElementById('spotInput');
        if (input.value.trim()) {
            spots.push(input.value.trim());
            localStorage.setItem('myMagicSpots', JSON.stringify(spots));
            input.value = '';
            renderSpots();
        }
    }
    function deleteSpot(i) {
        spots.splice(i, 1);
        localStorage.setItem('myMagicSpots', JSON.stringify(spots));
        renderSpots();
    }
    renderSpots();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
